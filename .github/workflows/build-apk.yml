name: Build Android APK (synapsemed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 17 (for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ تم تعديل هذا السطر هنا (من v3 إلى v4)
      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: 5. Install Dependencies & Bundle Three.js r128 Offline
        run: |
          npm install
          npm run prepare-offline

      - name: 6. Create & Sync Capacitor Android Platform
        run: |
        mkdir -p www
          echo "<!DOCTYPE html><html><head><title>SynapseMed</title></head><body></body></html>" > www/index.html
          mkdir -p android/app/src/main/assets
          touch android/app/src/main/assets/capacitor.plugins.json
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          npx @capacitor/assets generate --android

      - name: 7. Patch Android Back Button & App Name & Fullscreen Theme
        run: |
          node configure-android-native.mjs

      - name: 8. Build Installable APK (Gradle assembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. Prepare APK for Direct Telegram Sharing
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./synapsemed.apk

      - name: 10. Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsemed-APK
          path: ./synapsemed.apk
          if-no-files-found: error
