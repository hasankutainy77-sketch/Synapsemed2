html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Tahoma,"Segoe UI",system-ui,sans-serif}

#vit{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
#vit div{background:var(--mon);color:var(--mi);padding:6px 4px;direction:ltr;text-align:center}

.pulse{animation:bl .8s infinite}@keyframes bl{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

.card.alert{border-color:var(--red);background:rgba(194,59,46,.1)}
.st{color:var(--mut);font-size:.85rem}.q{font-weight:700;margin:2px 0 4px}
.opt{display:block;width:100%;text-align:start;margin-top:8px;padding:11px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--mi);outline-offset:2px}
.go{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}

</head>

t+=`<path d="M64 56Q160 38 256 56" stroke="${C.rib}" stroke-width="6" fill="none" opacity=".85"/>`;
t+=`<rect x="${152+hx}" y="96" width="36" height="64" rx="14" fill="${C.ht}" opacity="${x?.85:1}"/><ellipse cx="${172+hx}" cy="215" rx="34" ry="42" fill="${C.ht}" opacity="${x?.9:1}" stroke="${x?"none":"#8E2F2F"}"/>`;
t+=`<path d="M160 34L${160-sh*18} 110L${126-sh*10} 150M${160-sh*18} 110L${194-sh*10} 150" stroke="${C.tr}" stroke-width="${x?9:7}" fill="none" stroke-linecap="round"/>`;
t+=`<path d="M50 282Q100 250 152 270M168 270Q220 ${252+sh*16} 270 282" stroke="${C.dia}" stroke-width="3" fill="none"/>`;
if(S.tube){t+=`<path d="M270 214C246 226 226 180 214 112" stroke="${x?"#fff":"#5E6772"}" stroke-width="${x?2.5:4}" fill="none"/><path d="M270 214L298 240" stroke="${x?"#fff":"#5E6772"}" stroke-width="3"/>`;if(!x)t+=`<rect x="284" y="240" width="30" height="40" rx="4" fill="#CFE3F0" stroke="#8FAAC2"/><rect x="286" y="262" width="26" height="16" fill="#8FC1E0"/>${S.dr?`<circle class="pulse" cx="296" cy="266" r="3" fill="#fff"/>`:""}`}
if(S.nd&&!x)t+=`<path d="M214 96L222 114" stroke="#222" stroke-width="2"/><circle cx="214" cy="96" r="3" fill="#C0211B"/>`;
if(S.site&&!x&&!S.tube)t+=`<circle class="pulse" cx="270" cy="208" r="8" fill="none" stroke="#1F7A55" stroke-width="2.5"/>`;
if(x)t+=`<g fill="#f0f0f0" font-size="14"><text x="14" y="30">R</text><text x="296" y="30">L</text></g>`;
else{t+=`<g font-size="10" fill="#6b3a34"><text x="62" y="196">رئة يمنى</text><text x="196" y="60">رغامى</text>${pt>.1?`<text x="228" y="190">هواء بالجنب</text>`:""}<text x="190" y="150">رئة يسرى</text><text x="96" y="318">حجاب</text></g>`;if(tn)t+=`<path class="pulse" d="M196 30Q206 22 214 32" stroke="#3057B5" stroke-width="4" fill="none"/>`}
return t+"</svg>"}
/* ----- منظر الإجراء ----- */
function proc(){const ps=S.ps,e=S.ev&&S.ev.k,pt=e=="tn"?.85:S.pt,top=178+pt*70;
let t=`<svg viewBox="0 0 320 340" role="img" aria-label="مقطع جدار الصدر أثناء تركيب الأنبوب"><rect width="320" height="340" fill="#FBEDE8"/><rect y="20" width="320" height="14" fill="#E8B98F"/><rect y="34" width="320" height="46" fill="#F2D98A"/><rect y="80" width="320" height="40" fill="#B5504A"/><rect y="120" width="320" height="48" fill="#9E4A4A"/>`;
t+=`<ellipse cx="72" cy="144" rx="52" ry="26" fill="#EAE0CC" stroke="#B8A98A"/><ellipse cx="248" cy="144" rx="52" ry="26" fill="#EAE0CC" stroke="#B8A98A"/>`;
t+=`<circle cx="130" cy="140" r="4" fill="#4F6FD0"/><circle cx="130" cy="150" r="4" fill="#C0211B"/><circle cx="130" cy="160" r="4" fill="#E8D24A"/>`;
t+=`<rect y="168" width="320" height="3" fill="#F4C7C3"/><rect y="171" width="320" height="${Math.max(0,top-171)}" fill="#E4EEF4"/><path d="M0 ${top}Q80 ${top-12} 160 ${top}T320 ${top}V340H0Z" fill="#F3B6B0"/>`;
if(ps>=1)t+=`<rect x="176" y="20" width="22" height="150" fill="#FFE98A" opacity=".45"/>`;
if(ps>=2)t+=`<rect x="182" y="20" width="10" height="14" fill="#2a1414"/>`;
if(ps>=3)t+=`<rect x="184" y="34" width="6" height="134" fill="#2a1414"/>`;
if(ps>=4)t+=`<rect x="184" y="168" width="6" height="8" fill="#2a1414"/>`;
if(ps>=5){t+=`<path d="M188 8L188 176Q186 198 150 206L84 208" stroke="#6B7480" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="110" cy="208" r="2" fill="#fff"/><circle cx="130" cy="207" r="2" fill="#fff"/>`;if(S.dr)t+=`<path d="M188 8Q220 -4 262 8" stroke="#6B7480" stroke-width="5" fill="none"/><rect x="262" y="2" width="34" height="16" rx="3" fill="#CFE3F0" stroke="#8FAAC2"/>`}
if(S.sec)t+=`<rect x="170" y="14" width="40" height="8" fill="#fff" opacity=".9"/>`;
if(e=="bl")t+=`<circle class="pulse" cx="130" cy="150" r="16" fill="#C0211B" opacity=".75"/>`;
t+=`<g font-size="10" fill="#3a2a22"><text x="4" y="31">جلد</text><text x="4" y="62">دهن</text><text x="4" y="104">عضلات</text><text x="40" y="148">ضلع علوي</text><text x="218" y="148">ضلع سفلي</text><text x="136" y="186">جنب جداري</text><text x="4" y="236">فراغ جنبي (هواء)</text><text x="4" y="320">رئة</text><text x="100" y="178" fill="#1F7A55">مسار آمن فوق الضلع السفلي</text></g><text x="136" y="132" font-size="9" fill="#fff">حزمة وعائية عصبية</text></svg>`;
return t}
function scene(){const e=S.ev&&S.ev.k,v=S.vw||(e?(e=="bl"?"p":"a"):S.i<=1?"a":S.i<=3?(S.cxr?"x":"a"):S.i<=5?"a":S.i<=12?"p":S.i==13?"x":"a");
return `<div class="tabs">${[["a","تشريحي"],["x","أشعة"],["p","الإجراء"]].map(b=>`<button aria-pressed="${v==b[0]}" onclick="vw('${b[0]}')">${b[1]}</button>`).join("")}</div>`+(v=="p"?proc():chest(v))}
function vw(k){S.vw=k;render()}
function panel(){const c=S.state=="play"||S.state=="fb"?cur():0;
if(S.state=="dead")return `<div class="card alert"><div class="big bad">فشل</div><p>${S.dm}</p></div><button class="go" onclick="start()">أعد المحاولة</button>`;
if(S.state=="done"){const sc=Math.max(0,100-S.pen-Math.floor(S.loss/25)-Math.floor(S.hm/5)),e=[...new Set(S.errs)];
return `<div class="card"><div class="big ${sc>=75?"good":"bad"}">${sc}/100</div><p>دم مفقود: ${S.loss} مل. أخطاء: ${e.length}.</p>${e.length?`<p><b>أخطاؤك:</b></p><ul>${e.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<p class="good">ما غلطت بأي خطوة!</p>`}<p><b>نقاط تعليمية:</b></p><ul>${TEACH.map(x=>`<li>${x}</li>`).join("")}</ul></div><button class="go" onclick="start()">أعد الحالة</button>`}
const st=STEPS[S.i],ev=S.ev,I=ev?EV[ev.k].t+"!":st.s?st.s+" — "+st.t:st.t;
let h=`<div class="card ${ev?"alert":""}"><div class="st">${ev?"طارئ":"الخطوة "+(S.i+1)+" من "+STEPS.length}: ${I}</div>`;
if(S.state=="fb")h+=`<p class="good"><b>صح. </b>${S.fb}</p>`;else{h+=`<p class="q">${c.q}</p>`;if(ev&&ev.k=="tn")h+=`<div class="bar"><i style="width:${Math.min(100,S.hy)}%"></i></div><div class="st">تدهور المريض</div>`}
if(S.note)h+=`<p class="bad" role="status">${S.note}</p>`;
h+="</div>";
if(S.state=="fb")h+=`<button class="go" onclick="next()">${S.i==STEPS.length-1?"إنهاء":"الخطوة التالية"}</button>`;
else h+=S.ord.map(k=>`<button class="opt" onclick="pick(${k})">${c.o[k][0]}</button>`).join("");
return h}
const render=()=>{vit();$("#scene").innerHTML=scene();$("#panel").innerHTML=panel()};
function pick(k){const c=cur(),o=c.o[k];S.note="";
if(o[1]){if(S.ev){S.ev.n++;if(S.ev.n>=EV[S.ev.k].steps.length)return endEv();mix();return render()}
Object.assign(S,c.fx);S.fb=c.why;S.state="fb";return render()}
S.pen+=o[3];S.errs.push((S.ev?EV[S.ev.k].t:c.t)+": "+o[2]);S.note=o[2];
if(S.ev){if(S.ev.k=="tn"){S.hy+=10;S.hm=Math.max(S.hm,S.hy)}else S.loss+=100}
else if(o[4]){S.ev={k:o[4],n:0};mix();clearInterval(timer);timer=setInterval(tick,1000)}
render()}
function endEv(){clearInterval(timer);const k=S.ev.k,c=STEPS[S.i];S.ev=null;Object.assign(S,c.fx);if(k=="tn"){S.nd=1;S.pt=.45;S.sp=94;S.hy=0}S.fb=EV[k].ok+(k=="bl"?S.loss+" مل.":"");S.state="fb";render()}
function tick(){const e=S.ev;if(!e){clearInterval(timer);return}
if(e.k=="tn"){S.hy+=3;S.hm=Math.max(S.hm,S.hy);if(S.hy>=100)return die("تدهور المريض بسبب ريح صدرية توترية لم تُعالج بسرعة. التشخيص سريري: إبرة مزيلة للضغط فوراً ثم أنبوب صدري.")}
else{S.loss+=20;if(bp()<60)return die("فقد المريض كمية كبيرة من الدم بسبب إصابة وعاء وربي أو رئة. الضغط المباشر والسيطرة السريعة، وتجنب الحد السفلي للضلع.")}
vit();const b=$("#panel .bar i");if(b)b.style.width=Math.min(100,S.hy)+"%"}
function die(m){clearInterval(timer);S.ev=null;S.state="dead";S.dm=m;render()}
function next(){S.i++;S.fb=null;S.note="";if(S.i>=STEPS.length){S.i=STEPS.length-1;S.state="done"}else{S.state="play";mix()}render();window.scrollTo({top:0})}
function start(){clearInterval(timer);S=fresh();mix();render();window.scrollTo({top:0})}
start();
</script>
</body>
